<style>
:root{
  --bg:#0e0c09;
  --cream:#f3e3d2;
  --muted:#b3a191;
  --copper:#c48a5e;
  --ink:#1b120b;
  --line:rgba(196,138,94,.22);
  --line-2:rgba(196,138,94,.5);
  --ar:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:122px;-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:var(--ar);color:var(--cream);line-height:1.6;background:var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:rgba(14,12,9,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 8px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border:1px solid var(--line-2);border-radius:999px;color:var(--cream);text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn svg{width:15px;height:15px;flex:none}
.btn:hover,.btn:focus-visible{border-color:var(--copper);color:#fff}
.btn:focus-visible,.chips a:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.mini{display:block;height:40px;width:auto}
.chips{max-width:1100px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;padding:6px 14px;border:1px solid var(--line-2);border-radius:999px;background:rgba(243,227,210,.04);color:var(--cream);text-decoration:none;font-size:13.5px;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.chips a.on{background:var(--copper);border-color:var(--copper);color:var(--ink);font-weight:600}
.hint{max-width:1100px;margin:14px auto 0;padding:0 18px;font-size:12.5px;color:var(--muted);text-align:center}
.pages{max-width:1100px;margin:12px auto 0;padding:0 10px;display:grid;gap:12px}
.pages img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#16120e}
.end{max-width:1100px;margin:26px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

<script>
(function () {
  "use strict";
  if (!("IntersectionObserver" in window)) return;
  var chips = [].slice.call(document.querySelectorAll("#chips a"));
  /* page number -> chip that owns it (p3 belongs to the first hot-drinks chip) */
  var owner = {};
  chips.forEach(function (a, i) {
    var from = +a.getAttribute("href").slice(2);
    var to = i + 1 < chips.length ? +chips[i + 1].getAttribute("href").slice(2) - 1 : 13;
    for (var p = from; p <= to; p++) owner[p] = a;
  });
  var box = document.getElementById("chips"), current = null;
  function mark(a) {
    if (a === current) return;
    if (current) current.classList.remove("on");
    current = a;
    if (!a) return;
    a.classList.add("on");
    /* scroll only the chip strip; scrollIntoView could interrupt the page's own smooth scroll */
    var br = box.getBoundingClientRect(), ar = a.getBoundingClientRect();
    box.scrollBy({ left: (ar.left + ar.width / 2) - (br.left + br.width / 2), behavior: "smooth" });
  }
  var hold = 0; /* after a tap, keep the tapped tab lit while the page scrolls to it */
  chips.forEach(function (a) {
    a.addEventListener("click", function () { mark(a); hold = Date.now() + 1500; });
  });
  var io = new IntersectionObserver(function (entries) {
    if (Date.now() < hold) return;
    entries.forEach(function (e) {
      if (e.isIntersecting) mark(owner[+e.target.id.slice(1)] || null);
    });
  }, { rootMargin: "-130px 0px -70% 0px" }); /* a band just under the sticky header */
  [].forEach.call(document.querySelectorAll(".pages img"), function (img) { io.observe(img); });
  /* the last sections can't reach the band, so the page bottom counts as the last section */
  window.addEventListener("scroll", function () {
    if (Date.now() < hold) return;
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) mark(owner[13]);
  }, { passive: true });
})();
</script>
